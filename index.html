<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Engine Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        details.config {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
        }

        details.config summary {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            user-select: none;
        }

        details.config .form-group {
            margin-top: 12px;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: var(--danger);
        }

        .field-error {
            color: var(--danger);
            font-size: 0.78rem;
            margin-top: 4px;
            min-height: 1em;
        }

        .row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .row .form-group {
            flex: 1;
            min-width: 140px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(15, 23, 42, 0.35);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        button.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #result-container {
            margin-top: 25px;
            padding: 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: none;
        }

        #result-container.show {
            display: block;
        }

        .result-header {
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .status-approved { color: var(--success); }
        .status-rejected { color: var(--danger); }
        .status-pending { color: var(--warning); }

        .result-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: monospace;
            white-space: pre-wrap;
        }

        .history {
            margin-top: 25px;
        }

        .history h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .history-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.82rem;
        }

        .history-item .meta {
            color: var(--text-muted);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Trading Engine Portal</h1>
        <p class="subtitle">Submit live orders to your Spring Boot risk microservice.</p>

        <details class="config">
            <summary>Backend connection settings</summary>
            <div class="form-group">
                <label for="backendUrl">Backend URL</label>
                <input type="url" id="backendUrl" value="http://localhost:8080/api/orders" required>
            </div>
        </details>

        <form id="orderForm" novalidate>
            <div class="row">
                <div class="form-group">
                    <label for="orderId">Order ID</label>
                    <input type="text" id="orderId" value="ORD-101" pattern=".{1,64}" required>
                    <div class="field-error" id="err-orderId"></div>
                </div>
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" value="user_1" pattern=".{1,64}" required>
                    <div class="field-error" id="err-userId"></div>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="symbol">Symbol</label>
                    <input type="text" id="symbol" value="AAPL" pattern="[A-Za-z.]{1,10}" required>
                    <div class="field-error" id="err-symbol"></div>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" value="10" min="1" step="1" required>
                    <div class="field-error" id="err-quantity"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" step="0.01" id="price" value="150.00" min="0.01" required>
                <div class="field-error" id="err-price"></div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="spinner" aria-hidden="true"></span>
                <span class="btn-label">Submit Order &amp; Evaluate Risk</span>
            </button>
        </form>

        <div id="result-container" role="status" aria-live="polite">
            <div class="result-header">
                <span>Evaluation Result</span>
                <span id="resStatus">--</span>
            </div>
            <div class="result-details" id="resDetails">--</div>
        </div>

        <div class="history">
            <h2>Recent submissions</h2>
            <ul class="history-list" id="historyList">
                <li class="empty-state" id="historyEmpty">No orders submitted yet this session.</li>
            </ul>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('orderForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnLabel = submitBtn.querySelector('.btn-label');
            const resultContainer = document.getElementById('result-container');
            const resStatus = document.getElementById('resStatus');
            const resDetails = document.getElementById('resDetails');
            const historyList = document.getElementById('historyList');
            const historyEmpty = document.getElementById('historyEmpty');

            const REQUEST_TIMEOUT_MS = 8000;
            const history = [];

            function fieldError(id, message) {
                const el = document.getElementById('err-' + id);
                if (el) el.textContent = message || '';
            }

            function clearFieldErrors() {
                ['orderId', 'userId', 'symbol', 'quantity', 'price'].forEach(function (id) {
                    fieldError(id, '');
                });
            }

            function validate(data) {
                clearFieldErrors();
                let ok = true;

                if (!data.orderId.trim()) {
                    fieldError('orderId', 'Order ID is required.');
                    ok = false;
                }
                if (!data.userId.trim()) {
                    fieldError('userId', 'User ID is required.');
                    ok = false;
                }
                if (!/^[A-Za-z.]{1,10}$/.test(data.symbol.trim())) {
                    fieldError('symbol', 'Use 1-10 letters, e.g. AAPL.');
                    ok = false;
                }
                if (!Number.isInteger(data.quantity) || data.quantity <= 0) {
                    fieldError('quantity', 'Quantity must be a positive whole number.');
                    ok = false;
                }
                if (!(data.price > 0)) {
                    fieldError('price', 'Price must be greater than 0.');
                    ok = false;
                }
                return ok;
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.classList.toggle('loading', isLoading);
                btnLabel.textContent = isLoading ? 'Submitting...' : 'Submit Order & Evaluate Risk';
            }

            function renderHistory() {
                historyList.innerHTML = '';
                if (history.length === 0) {
                    historyList.appendChild(historyEmpty);
                    return;
                }
                history.slice(0, 10).forEach(function (entry) {
                    const li = document.createElement('li');
                    li.className = 'history-item';

                    const left = document.createElement('span');
                    left.textContent = entry.orderId + ' \u2022 ' + entry.symbol + ' x' + entry.quantity;

                    const right = document.createElement('span');
                    right.className = 'meta';
                    right.textContent = entry.status + ' \u2022 ' + entry.time;
                    right.style.color = entry.status === 'APPROVED' ? 'var(--success)'
                        : entry.status === 'REJECTED' ? 'var(--danger)'
                        : 'var(--warning)';

                    li.appendChild(left);
                    li.appendChild(right);
                    historyList.appendChild(li);
                });
            }

            function addHistory(orderId, symbol, quantity, status) {
                history.unshift({
                    orderId: orderId,
                    symbol: symbol,
                    quantity: quantity,
                    status: status,
                    time: new Date().toLocaleTimeString()
                });
                renderHistory();
            }

            function showResult(status, detailsText) {
                resultContainer.classList.add('show');
                resStatus.textContent = status;
                resStatus.className = status === 'APPROVED' ? 'status-approved'
                    : status === 'REJECTED' ? 'status-rejected'
                    : 'status-pending';
                resDetails.textContent = detailsText;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const backendUrl = document.getElementById('backendUrl').value.trim();
                const orderData = {
                    orderId: document.getElementById('orderId').value.trim(),
                    userId: document.getElementById('userId').value.trim(),
                    symbol: document.getElementById('symbol').value.trim().toUpperCase(),
                    quantity: parseInt(document.getElementById('quantity').value, 10),
                    price: parseFloat(document.getElementById('price').value),
                    timestamp: new Date().toISOString()
                };

                if (!backendUrl) {
                    showResult('PENDING', 'Set a backend URL in the connection settings above.');
                    return;
                }

                if (!validate(orderData)) {
                    showResult('PENDING', 'Fix the highlighted fields and try again.');
                    return;
                }

                setLoading(true);
                showResult('PENDING', 'Sending request to ' + backendUrl + ' ...');

                const controller = new AbortController();
                const timeoutId = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);

                try {
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    let data = null;
                    try {
                        data = await response.json();
                    } catch (parseErr) {
                        data = null;
                    }

                    if (!response.ok) {
                        const reason = (data && data.reason) || ('HTTP ' + response.status + ' ' + response.statusText);
                        showResult('REJECTED', 'Order ID: ' + orderData.orderId + '\nReason: ' + reason);
                        addHistory(orderData.orderId, orderData.symbol, orderData.quantity, 'REJECTED');
                        return;
                    }

                    if (!data || typeof data.status !== 'string') {
                        showResult('PENDING', 'Server responded but returned an unexpected payload.');
                        return;
                    }

                    showResult(data.status, 'Order ID: ' + (data.orderId || orderData.orderId) + '\nReason: ' + (data.reason || 'n/a'));
                    addHistory(orderData.orderId, orderData.symbol, orderData.quantity, data.status);

                } catch (error) {
                    clearTimeout(timeoutId);
                    const message = error.name === 'AbortError'
                        ? 'Request timed out after ' + (REQUEST_TIMEOUT_MS / 1000) + 's. Is the backend running at ' + backendUrl + '?'
                        : 'Failed to connect to backend at ' + backendUrl + '. Check it is running and reachable (CORS, port, network).';
                    showResult('ERROR', message);
                    addHistory(orderData.orderId, orderData.symbol, orderData.quantity, 'ERROR');
                } finally {
                    setLoading(false);
                }
            });
        })();
    </script>

</body>
</html>
